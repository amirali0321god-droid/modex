<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modex | پلتفرم تبادل پایاپای و credit محلی</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        h1 { color: var(--accent); font-size: 1.8rem; letter-spacing: 1px; }
        p.subtitle { color: var(--text-muted); font-size: 0.85rem; margin-top: 5px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border); }
        h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: white; }
        button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; border: none; margin-top: 5px; }
        button:hover { background: var(--accent-hover); }
        .user-info { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 8px; }
        .badge { background: #22c55e; color: black; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 0.8rem; }
        .item-card { border-bottom: 1px solid var(--border); padding: 10px 0; }
        .item-card:last-child { border-bottom: none; }
        .item-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .item-title { font-weight: bold; }
        .item-credit { color: #f59e0b; font-size: 0.9rem; }
        .item-owner { font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MODEX</h1>
            <p class="subtitle">شبکه هوشمند تبادل کالا و خدمات محلی</p>
        </header>

        <div class="card">
            <h2>پروفایل فعال</h2>
            <div class="user-info">
                <div>
                    <strong id="userName">کاربر مودکس</strong><br>
                    <small style="color: var(--text-muted);">اعتبار حساب:</small>
                </div>
                <div class="badge"><span id="userCredit">500</span> امتیاز</div>
            </div>
        </div>

        <div class="card">
            <h2>ثبت جدید در بازارچه Modex</h2>
            <input type="text" id="itemTitle" placeholder="عنوان کالا یا خدمت">
            <input type="number" id="itemValue" placeholder="ارزش پیشنهادی (امتیاز)">
            <select id="itemType">
                <option value="کالا">کالا / محصول محلی</option>
                <option value="خدمت">مهارت / خدمت تخصصی</option>
            </select>
            <button onclick="addItem()">انتشار در پلتفرم</button>
        </div>

        <div class="card">
            <h2>بازارچه پایاپای</h2>
            <div id="itemList">
                <div class="item-card">
                    <div class="item-header">
                        <span class="item-title">۵۰ کیلو گردوی درجه یک</span>
                        <span class="item-credit">۱۵۰ امتیاز</span>
                    </div>
                    <div class="item-owner">ثبت‌شده توسط: آرمین | صنف: محصولات محلی</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addItem() {
            const title = document.getElementById('itemTitle').value;
            const value = document.getElementById('itemValue').value;
            if(!title || !value) { alert('لطفاً عنوان و ارزش امتیاز را وارد کنید.'); return; }
            
            const list = document.getElementById('itemList');
            const newItem = document.createElement('div');
            newItem.className = 'item-card';
            newItem.innerHTML = `
                <div class="item-header">
                    <span class="item-title">${title}</span>
                    <span class="item-credit">${value} امتیاز</span>
                </div>
                <div class="item-owner">ثبت‌شده توسط: کاربر فعال | صنف: عمومی</div>
            `;
            list.prepend(newItem);
            document.getElementById('itemTitle').value = '';
            document.getElementById('itemValue').value = '';
        }
    </script>
</body>
</html>
